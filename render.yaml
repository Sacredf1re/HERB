services:
  - type: web
    name: wildroot-shop
    runtime: node
    plan: free
    buildCommand: npm install && npx prisma db push && node prisma/seed.js && npm run build
    startCommand: npm start
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: wildroot-db
          property: connectionString
      - key: NEXTAUTH_SECRET
        generateValue: true
      - key: NEXTAUTH_URL
        sync: false

databases:
  - name: wildroot-db
    plan: free
